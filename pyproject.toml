[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nayraastra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nayraastra"]

[project]
name = "nayraastra"
dynamic = ["version"]
description = "A pentesting automation and orchestration framework"
readme = "README.md"
license = { text = "TODO" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "rich",
    "prompt_toolkit",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-PyYAML",
    "pre-commit",
    "hypothesis",
]

[project.scripts]
nayraastra = "nayraastra.cli:main"

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "C4", "PL"]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR0917", # too many positional arguments
    "PLR2004", # magic value comparison
    "SIM118",  # sqlite3.Row requires .keys() for column containment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S603", "PLR0913", "PLR0915", "PLR0917"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=nayraastra --cov-report=term-missing"
markers = [
    "unit: fast isolated unit tests",
    "integration: tests that touch the filesystem or run subprocesses",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["nayraastra"]
omit = ["tests/*", "src/nayraastra/__main__.py"]

[tool.coverage.report]
fail_under = 70
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.paths]
source = ["src/nayraastra"]
